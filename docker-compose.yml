services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: court_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: court123
      POSTGRES_DB: court_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - court_network

  # ==================== MinIO 对象存储 ====================
  minio:
    image: minio/minio:latest
    container_name: court_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # Console 端口（管理界面）
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - court_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  court_network:
    driver: bridge